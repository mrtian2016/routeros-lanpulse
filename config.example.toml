# ============================================================================
#  lanpulse configuration. Copy to config.toml and edit.
#
#  This file holds identities only — addresses, names, switches. Never secrets:
#  passwords live in .env, so you can paste this file into an issue as-is.
#
#  Apart from [router], every module is DISABLED by default. Get the router
#  working first, then turn on the ones you actually have. A disabled module
#  hides its panels and is skipped by the startup self-check.
#
#  Do the router-side setup first: docs/SETUP.md
# ============================================================================

[site]
title = "routeros-lanpulse"        # Page heading. Anything you like.
# Small text next to the live indicator. Empty falls back to the built-in label.
note = ""
# Only affects how event timestamps are displayed.
timezone = "Asia/Shanghai"

[prometheus]
url = "http://prometheus:9090"
# Rate window. mktxp scrapes every 15 s by default, so anything under 30 s
# will not produce a value.
rate_window = "1m"

# ── Router (RouterOS) ───────────────────────────────────────────────────────
# Metrics come from mktxp (https://github.com/akpw/mktxp).
[router]
enabled = true
label = "RouterOS"                 # Name drawn on the topology diagram
name = "ROS"                       # Section name in mktxp.conf — becomes the
                                   # routerboard_name label. These MUST match.
host = "192.168.1.1"               # Binary API address, used by the 1-second fast lane
port = 8728
user = "mon"                       # Password goes in .env as ROS_PASS, not here
wan_interface = "pppoe-out1"       # pppoe-outN when dialling; the physical port
                                   # name (e.g. ether1) for static IP or DHCP
lan_interface = "bridge"           # Bridge name
wg_interface_regex = "wg.*"        # Regex matching your WireGuard interfaces
# Read counters straight from the router once a second. Turn off and everything
# falls back to Prometheus — the granularity of your scrape interval, which
# makes the page move in visible steps instead of flowing.
fast_lane = true

# ── Edge host (optional) ────────────────────────────────────────────────────
# The machine that terminates your tunnels and reverse proxies. Requires
# node_exporter plus the collectors in exporters/textfile/ — see its README.
[edge]
enabled = false
instance = "192.168.1.11:9100"
label = "edge"

# ── Proxmox VE (optional) ───────────────────────────────────────────────────
# Metrics from prometheus-pve-exporter.
[pve]
enabled = false
instance = "192.168.1.10:9100"     # node_exporter on the hypervisor
memory_total_gb = 32               # Denominator for the "guest memory used" bar

# ── Hardware panels (0..n) ──────────────────────────────────────────────────
# One [[hardware]] block per machine with a BMC. All commented out by default —
# with no such machine you should not be looking at empty panels.
#
# [[hardware]]
# key = "host-a"                     # Internal id. Anything, but must be unique.
# title = "Proxmox host"
# hint = "BMC 192.168.1.20"
# bmc = "host-a"                     # Target name in ipmi-exporter (the bmc label)
# instance = "192.168.1.10:9100"     # node_exporter on the SAME machine
# storage = "pve"                    # pve = PVE storage pools | fs = filesystems | none
# nvme = true                        # Show NVMe temperature and wear
#
# [[hardware]]
# key = "host-b"
# title = "Application server"
# hint = "BMC 192.168.1.21"
# bmc = "host-b"
# instance = "192.168.1.15:9100"
# storage = "fs"
# nvme = false

# ── NAS (optional, SNMP) ────────────────────────────────────────────────────
[nas]
enabled = false
title = "NAS"
hint = "SNMPv3 · volumes / disks / UPS"

# ── UniFi wireless (optional) ───────────────────────────────────────────────
[unifi]
enabled = false

# ── NetFlow (optional) ──────────────────────────────────────────────────────
# Point the router's /ip/traffic-flow at the bundled collector — see docs/SETUP.md.
[netflow]
enabled = false
url = "http://netflow:9133"

# ── Device naming ───────────────────────────────────────────────────────────
# The router can only name devices it has a DHCP lease for. Machines with a
# static address (cloud-init VMs, for instance) show up as a bare MAC — name
# them here. Both tables are optional.
[hosts.by_mac]
# "AA:BB:CC:11:22:33" = "monitoring host"
# "AA:BB:CC:11:22:34" = "edge host"

# Address -> name, for NetFlow (the sankey and the LAN top list).
[hosts.by_ip]
# "192.168.1.1"  = "router"
# "192.168.1.50" = "NAS"

# ── Topology diagram ────────────────────────────────────────────────────────
# Canvas is 960x520. Edit this to draw the shape of YOUR network; delete a node
# and the links to it disappear with it.
# core = true draws a heavier border; group = true is a side heading (no box).
[topology.nodes]
# Layout rule: a node's downstream group sits in its own horizontal band, ordered
# the same way as its source. LAN is above edge, so LAN's groups take the upper
# bands and edge's the lower ones — that is what keeps the curves from crossing.
internet = { x = 200, y = 240, w = 110, h = 48, name = "Internet", sub = "public IPv4" }
ros      = { x = 380, y = 240, w = 140, h = 56, name = "RouterOS", sub = "192.168.1.1 · NAT / FW / WG", core = true }
unifi    = { x = 640, y = 20,  w = 130, h = 48, name = "UniFi AP", sub = "192.168.1.30 · Wi-Fi" }
lan      = { x = 640, y = 100, w = 140, h = 56, name = "LAN / switch", sub = "192.168.1.0/24", core = true }
edge     = { x = 640, y = 340, w = 150, h = 56, name = "edge", sub = "192.168.1.11 · ingress / mesh", core = true }
# Groups: x/y is the first slot's top-left corner, gap is the row pitch.
# Every member's position follows from these three numbers.
wgg  = { x = 30,  y = 40,  w = 96,  h = 20, gap = 26, name = "WireGuard peers",  group = true }
ovg  = { x = 30,  y = 430, w = 96,  h = 20, gap = 26, name = "OpenVPN users",    group = true }
lang = { x = 950, y = 60,  w = 150, h = 20, gap = 26, name = "Top LAN devices",  group = true }
ing  = { x = 950, y = 230, w = 120, h = 18, gap = 24, name = "ingress / public", group = true }
brg  = { x = 950, y = 340, w = 120, h = 18, gap = 24, name = "branch sites",     group = true }
tsg  = { x = 950, y = 490, w = 120, h = 18, gap = 24, name = "tailnet",          group = true }

# ── Bypass router / clash (optional) ────────────────────────────────────────
# Live split-tunnel stats on the flow map, read straight from the mihomo (Clash
# Meta) controller API on your bypass router. Shows the proxied rate, connection
# counts (proxied vs direct) and the busiest rule groups on hover.
[bypass]
enabled = false
api = "http://192.168.1.7:9090"    # mihomo external-controller address
secret = ""                        # its `secret`, if you set one
label = "旁路由"                   # node name on the map (any text)

# ── Redaction ───────────────────────────────────────────────────────────────
# Replaces public IPs, private IPs, MACs, domains, device names and site names
# with deterministic pseudonyms in /api/state.json. Turn it on before you post
# a screenshot anywhere public.
[redact]
enabled = false
# Keep the subnet structure (only the last octet changes) or replace outright.
keep_subnet = true
# Hide CPU / disk / board models too. Off by default — when people share homelab
# screenshots the hardware is usually the part they want to show, and a model
# number does not point at a person. Turn it on for a fully public demo.
mask_hardware = false

# ── Events ──────────────────────────────────────────────────────────────────
[events]
buffer = 200                       # Events kept in memory (cleared on restart)
wan_burst_floor_mbps = 8           # WAN burst threshold
device_burst_floor_mbps = 5        # LAN device burst threshold
ingress_burst_floor_mbps = 1       # Ingress / tunnel burst threshold
burst_multiplier = 4               # How many times the recent average counts as a burst
burst_cooldown_sec = 60            # Do not re-report the same subject within this
ovpn_burst_floor_mbps = 3
bypass_burst_floor_mbps = 3         # Per-client burst through the bypass router          # OpenVPN dial-in user burst threshold
disk_warn_pct = 85                 # Warn above this disk / storage usage
# Event levels: info | warn | bad. The level drives the colour, and decides
# whether [alerts].levels picks it up. Set burst_level = "info" to keep bursts
# on the dashboard but never push them to your phone.
burst_level = "warn"               # Level of traffic-burst events
threshold_level = "warn"           # Level of temperature / disk threshold events

# ── Alerting ────────────────────────────────────────────────────────────────
# Push events to your phone. Credentials go in .env, not here:
#   BARK_KEY / TELEGRAM_TOKEN / TELEGRAM_CHAT_ID
[alerts]
enabled = false
lang = "zh"                        # Notification language: zh | en
levels = ["warn", "bad"]           # Which levels get pushed. info is usually noise.
cooldown_sec = 300                 # Do not repeat the same text within this
startup_quiet_sec = 60             # Quiet period after start — the router's log
                                   # buffer gets replayed on boot; without this
                                   # every restart fires a screenful
max_per_hour = 20                  # Hourly cap. Alerts that are too noisy get ignored.
# Separate push threshold for burst events, in Mbps. 0 = no extra filter.
# The [events] floors are set low so you can see trends on the dashboard, but a
# normal download should not buzz your phone — set this to 200 or so and only
# genuinely unusual volume gets pushed.
min_burst_mbps = 0

# Per-event-type push switches. Types that are OFF still appear on the dashboard,
# they just do not reach your phone. Defaults follow one rule: does this need you
# to do something? Actionable types on, informational off.
# Types missing from this table default to ON — when an upgrade adds a new event
# type, being briefly noisy beats silently swallowing it.
[alerts.kinds]
hw = true                          # Hardware: temperature / fans / disk full / RAID
branch = true                      # Branch tunnels going down and coming back
wan = true                         # WAN link up/down
vm = true                          # Guests starting and stopping
ovpn = true                        # OpenVPN dial-in users
wg = false                         # WireGuard peers (phones roam; this gets chatty)
ts = false                         # tailnet nodes
lan = false                        # LAN devices joining / leaving
wifi = false                       # Wi-Fi join / leave / roam
ingress = false                    # Ingress connection counts
burst = false                      # Traffic bursts (usually interesting, not actionable)

[alerts.bark]
enabled = false
server = "https://api.day.app"     # Point at your own server if you self-host
group = "routeros-lanpulse"
sound = ""                         # Empty = default
icon = ""

[alerts.telegram]
enabled = false
# Telegram's API is unreachable from some regions. Point this at your own reverse
# proxy, or set https_proxy on the container (urllib honours it by default).
api_base = "https://api.telegram.org"
