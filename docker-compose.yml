# lanpulse — profiles decide which exporters run. Start only what you actually have:
#
#   docker compose up -d                                  # dashboard + Prometheus only
#   docker compose --profile router up -d                 # + RouterOS (mktxp)
#   docker compose --profile router --profile pve up -d   # + Proxmox VE
#   docker compose --profile all up -d                    # everything
#
# Before the first run:
#   cp config.example.toml config.toml   and edit it (every option is commented)
#   cp .env.example .env                 and fill in the passwords
services:
  lanpulse:
    # Pulls the prebuilt image by default. To run local changes: docker compose up -d --build
    image: ghcr.io/mrtian2016/routeros-lanpulse:latest
    build: .
    pull_policy: missing
    container_name: lanpulse
    restart: unless-stopped
    ports: ["${BIND_ADDR:-0.0.0.0}:${LANPULSE_PORT:-9132}:9132"]
    volumes:
      # Writable so the settings page can save. Make it :ro if you never want the
      # browser to change config — the settings page will then report a write failure.
      - ./config.toml:/app/config.toml:rw
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PROM: http://prometheus:9090
      ROS_PASS: ${ROS_PASS:-}          # Router read-only password; never in config.toml
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}   # Unset = settings page disabled (fail-closed)
      BARK_KEY: ${BARK_KEY:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:latest
    container_name: lanpulse-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["${BIND_ADDR:-127.0.0.1}:9090:9090"]

  # ── RouterOS metrics ─────────────────────────────────────────────────────
  mktxp:
    image: ghcr.io/akpw/mktxp:latest
    container_name: lanpulse-mktxp
    restart: unless-stopped
    profiles: [router, all]
    # mktxp reads /etc/mktxp, NOT /root/mktxp. Getting this wrong is deceptive:
    # all three containers report healthy and the page returns 200, but mktxp
    # quietly falls back to the image's sample config and tries to reach
    # Sample-Router@192.168.88.1, so the dashboard stays empty.
    volumes: ["./exporters/mktxp:/etc/mktxp"]

  # ── Proxmox VE ──────────────────────────────────────────────────────────
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: lanpulse-pve-exporter
    restart: unless-stopped
    profiles: [pve, all]
    environment:
      PVE_USER: ${PVE_USER:-}
      PVE_TOKEN_NAME: ${PVE_TOKEN_NAME:-}
      PVE_TOKEN_VALUE: ${PVE_TOKEN_VALUE:-}
      PVE_VERIFY_SSL: "false"

  # ── IPMI (any machine with a BMC) ────────────────────────────────────────
  ipmi-exporter:
    image: prometheuscommunity/ipmi-exporter:latest
    container_name: lanpulse-ipmi-exporter
    restart: unless-stopped
    profiles: [ipmi, all]
    volumes: ["./exporters/ipmi/ipmi.yml:/config.yml:ro"]
    command: ["--config.file=/config.yml"]

  # ── SNMP (NAS / switches) ────────────────────────────────────────────────
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: lanpulse-snmp-exporter
    restart: unless-stopped
    profiles: [snmp, all]
    volumes: ["./exporters/snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro"]

  # ── NetFlow v9 collector (bundled) ───────────────────────────────────────
  netflow:
    build: ./exporters/netflow
    container_name: lanpulse-netflow
    restart: unless-stopped
    profiles: [netflow, all]
    ports: ["${BIND_ADDR:-0.0.0.0}:2055:2055/udp"]
    environment:
      LAN_CIDR: ${LAN_CIDR:-192.168.1.0/24}

  # ── UniFi (bundled, API-key based) ───────────────────────────────────────
  unifi-exporter:
    build: ./exporters/unifi
    container_name: lanpulse-unifi-exporter
    restart: unless-stopped
    profiles: [unifi, all]
    environment:
      UNIFI_URL: ${UNIFI_URL:-}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}

volumes:
  prom-data:
