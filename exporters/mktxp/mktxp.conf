# mktxp 采集 RouterOS 指标。段名要和 config.toml 里的 router.name 一致 ——
# 它会变成指标上的 routerboard_name 标签。
[ROS]
    enabled = True
    hostname = 192.168.1.1
    port = 8728
    username = mon                 # 建议单独建 group=read 的只读账号
    password = CHANGE_ME
    use_ssl = False
    interface = True
    wireguard = True
    wireguard_peers = True
    ppp = True
    firewall = True
    dhcp = True
    dhcp_lease = True
    kid_control_assigned = True    # 内网每设备流量靠它
    kid_control_dynamic = True
    connections = True
    system = True
    poe = False                    # x86 软路由没有 PoE, 开了会报错
    route = False
    pool = False
