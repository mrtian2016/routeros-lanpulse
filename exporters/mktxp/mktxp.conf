# mktxp scrapes RouterOS metrics.
# The section name MUST match router.name in config.toml — it becomes the
# routerboard_name label on every metric.
[ROS]
    enabled = True
    hostname = 192.168.1.1
    port = 8728
    username = mon                 # Use a read-only account, see docs/SETUP.md
    password = CHANGE_ME
    use_ssl = False
    interface = True
    wireguard = True
    wireguard_peers = True
    ppp = True
    firewall = True
    dhcp = True
    dhcp_lease = True
    kid_control_assigned = True    # Per-device LAN traffic depends on these two
    kid_control_dynamic = True
    connections = True
    system = True
    poe = False                    # x86 / CHR has no PoE; leaving it on causes errors
    route = False
    pool = False
