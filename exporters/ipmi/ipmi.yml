# ipmi-exporter. One entry per BMC credential set.
# The target names you scrape must match hardware.bmc in config.toml.
modules:
  default:
    user: "ADMIN"
    pass: "CHANGE_ME"
    driver: "LAN_2_0"
    privilege: "user"
    timeout: 10000
    collectors: [ipmi, dcmi, bmc]
    exclude_sensor_ids: []
