# snmp-exporter modules. Minimal Synology example below.
# For a complete OID table use the official generator:
# https://github.com/prometheus/snmp_exporter
modules:
  synology:
    walk:
      - 1.3.6.1.4.1.6574.1      # synoSystem: status / temperature
      - 1.3.6.1.4.1.6574.2      # synoDisk:   model / temperature / health
      - 1.3.6.1.4.1.6574.3      # synoRaid:   array status
      - 1.3.6.1.4.1.6574.4      # synoUPS
    version: 3
    auth:
      security_level: authPriv
      username: CHANGE_ME
      password: CHANGE_ME
      auth_protocol: SHA
      priv_protocol: AES
      priv_password: CHANGE_ME
