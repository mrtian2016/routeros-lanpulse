# lanpulse 用的 Prometheus 配置示例。
# 只保留你真正有的 job —— 少一个 job, 面板上对应的那块会自动隐藏, 不会报错。
global:
  scrape_interval: 15s          # 面板 1 秒粒度那部分是直连路由器算的, 这里 15s 足够
  scrape_timeout: 10s

scrape_configs:
  # ── RouterOS (mktxp) ──────────────────────────────────────────────────
  - job_name: mktxp
    static_configs:
      - targets: ["mktxp:49090"]

  # ── 各主机 node_exporter ──────────────────────────────────────────────
  # 边缘主机上还要放 exporters/textfile/ 里的脚本 (隧道/入口/tailscale 采集)
  - job_name: node
    static_configs:
      - targets:
          - "192.168.1.10:9100"     # Proxmox 宿主机
          - "192.168.1.11:9100"     # edge
          - "192.168.1.15:9100"    # 应用服务器

  # ── Proxmox VE ────────────────────────────────────────────────────────
  - job_name: pve
    metrics_path: /pve
    params: { module: [default] }
    static_configs:
      - targets: ["192.168.1.10"]   # 这里填 PVE 主机地址
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "pve-exporter:9221" }

  # ── IPMI / BMC ────────────────────────────────────────────────────────
  - job_name: ipmi
    metrics_path: /ipmi
    static_configs:
      - targets: ["192.168.1.20", "192.168.1.21"]   # 各机器的 BMC 地址
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: bmc }
      - { target_label: __address__, replacement: "ipmi-exporter:9290" }

  # ── SNMP (群晖 / 交换机) ──────────────────────────────────────────────
  - job_name: snmp
    metrics_path: /snmp
    params: { module: [synology] }
    static_configs:
      - targets: ["192.168.1.50"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "snmp-exporter:9116" }

  # ── 本项目自带的两个采集器 ────────────────────────────────────────────
  - job_name: netflow
    static_configs: [{ targets: ["netflow:9133"] }]
  - job_name: unifi
    static_configs: [{ targets: ["unifi-exporter:9131"] }]
