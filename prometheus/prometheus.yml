# Example Prometheus config for lanpulse.
# Keep only the jobs you actually have. A missing job simply hides its panel.
global:
  scrape_interval: 15s          # The 1-second lane reads the router directly, so 15s is fine here
  scrape_timeout: 10s

scrape_configs:
  # ── RouterOS (mktxp) ──────────────────────────────────────────────────
  - job_name: mktxp
    static_configs:
      - targets: ["mktxp:49090"]

  # ── node_exporter on each host ────────────────────────────────────────
  # The edge host also needs the collectors from exporters/textfile/
  - job_name: node
    static_configs:
      - targets:
          - "192.168.1.10:9100"     # hypervisor
          - "192.168.1.11:9100"     # edge host
          - "192.168.1.15:9100"    # application server

  # ── Proxmox VE ────────────────────────────────────────────────────────
  - job_name: pve
    metrics_path: /pve
    params: { module: [default] }
    static_configs:
      - targets: ["192.168.1.10"]   # hypervisor address
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "pve-exporter:9221" }

  # ── IPMI / BMC ────────────────────────────────────────────────────────
  - job_name: ipmi
    metrics_path: /ipmi
    static_configs:
      - targets: ["192.168.1.20", "192.168.1.21"]   # BMC addresses
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: bmc }
      - { target_label: __address__, replacement: "ipmi-exporter:9290" }

  # ── SNMP (NAS / switches) ─────────────────────────────────────────────
  - job_name: snmp
    metrics_path: /snmp
    params: { module: [synology] }
    static_configs:
      - targets: ["192.168.1.50"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "snmp-exporter:9116" }

  # ── The two collectors bundled with this project ──────────────────────
  - job_name: netflow
    static_configs: [{ targets: ["netflow:9133"] }]
  - job_name: unifi
    static_configs: [{ targets: ["unifi-exporter:9131"] }]
