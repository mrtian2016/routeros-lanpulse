# Publish docs/demo/ to GitHub Pages.
# The demo is plain static files (a redacted snapshot, all relative paths), so
# there is nothing to build — the directory is uploaded as-is.
#
# Note: free accounts can only publish Pages from a PUBLIC repo; private repos need Pro.
# On a private repo this workflow fails, which is expected.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths: ["docs/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the demo snapshot is redacted
        # Second line of defence: if someone hand-edits docs/demo, stop real data
        # from reaching the public internet
        run: |
          grep -q '"redacted":true\|"redacted": true' docs/demo/demo/fixture.js \
            || { echo "::error::demo snapshot is not redacted, refusing to publish"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo
      - id: deployment
        uses: actions/deploy-pages@v4
